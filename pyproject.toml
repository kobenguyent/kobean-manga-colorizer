[project]
name = "kobean-manga-colorizer"
version = "1.0.0"
description = "Next-Gen AI Manga & Comic Colorization Studio"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "kobenguyent", email = "joseph@kobean.ai" }
]
dependencies = [
    "aiofiles>=23.2.0",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "fastapi>=0.110.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "denoising/models",
    "networks/models.py",
    "sessions",
    "output",
    "uploads"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # Line length handled gracefully by formatter
    "B008",  # Do not perform function calls in argument defaults (standard FastAPI Depends/File)
    "C408",  # Unnecessary dict/list call
    "B904",  # Within an `except` clause, raise exceptions with `from err`
]

[tool.ruff.lint.isort]
known-first-party = ["colorizer_engine", "file_processor", "networks", "denoising"]
combine-as-imports = true
